syntax = "proto3";

option go_package = "./pb";

package gserver;

// 服务器信息
message ServerInfo {
  int32 ServerId = 1; // 服务器id
  string ServerType = 2; // 服务器类型
  string ServerListenAddr = 3; // 监听服务器地址
  string ClientListenAddr = 4; // 监听Tcp客户端地址
  string WsClientListenAddr = 5; // 监听WebSocket客户端地址
  string GateListenAddr = 6; // 监听网关地址
  int64 LastActiveTime = 7; // 最近上传信息的时间戳(毫秒)
  int32 Ping = 8; // ping值(毫秒)
}

// 踢玩家下线req
message KickPlayerReq {
  int64 AccountId = 1; // 账号id
  int64 PlayerId = 2; // 玩家id
}

// 踢玩家下线res
message KickPlayerRes {
  string Error = 1;
  int64 AccountId = 2; // 账号id
  int64 PlayerId = 3; // 玩家id
}

// 客户端掉线
message ClientDisconnect {
  uint32 ClientConnId = 1;
}

// 服务器连接上其他服务器时,发的初始化信息
message ServerHello {
  int32 ServerId = 1; // 服务器id
  string ServerType = 2; // 服务器类型
}

// 封禁记录,存储在MongoDB ban collection中
message BanRecord {
  int64 TargetId = 1;   // 封禁目标id（accountId或playerId）
  int32 TargetType = 2; // 1=账号, 2=玩家
  int64 BanTime = 3;    // 封禁时间戳（秒）
  int64 Duration = 4;   // 封禁时长（秒），0=永久
  string Reason = 5;    // 封禁原因
}
