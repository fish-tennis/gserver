syntax = "proto3";

option go_package = "./pb";

package gserver;

// 心跳包请求
message HeartBeatReq {
  int64 Timestamp = 1; // 请求方的时间戳(毫秒)
}

// 心跳包回复
message HeartBeatRes {
  int64 RequestTimestamp = 1; // 请求方的时间戳(毫秒)
  int64 ResponseTimestamp = 2;// 回复方的时间戳(毫秒)
}

// 同步服务器的时间给客户端
message ServerTimeSync {
  int64 RealTimestamp = 1; 		// 服务器的现实时间戳(毫秒)
  int64 VirtualTimestamp = 2; 	// 服务器的虚拟时间戳(毫秒)
  int32 UtcOffsetSeconds = 3; 	// 服务器时区相对UTC的偏移秒数(取自服务器time.Local,如东八区=28800;客户端按服务器时区计算日期边界/每日重置/格式化显示,便于不同地区的客户端正确处理)
}

// 通用的错误返回消息
message ErrorRes {
  int32 Command = 1; // 消息号
  int32 ResultId = 2; // 错误信息id
  string ResultStr = 3; // 错误信息内容
}

// 网关转发客户端消息到其他服务器,发生错误
message GateRouteClientPacketError {
  int64 PlayerId = 1;
  int32 Command = 2; // 消息号
  int32 ResultId = 3; // 错误信息id
  string ResultStr = 4; // 错误信息内容
}
