syntax = "proto3";

option go_package = "./pb";

package gserver;

import "player.proto";

// 同步任务数据给客户端
message QuestSync {
  map<int32,FinishedQuestData> Finished = 1; // 已完成的任务
  map<int32,QuestData> Quests = 2;   // 进行中的任务
}

// 任务数据更新
message QuestUpdate {
  int32 QuestCfgId = 1; // 任务id
  QuestData Data = 2;
}

// 删除一个任务
message QuestRemoveRes {
  int32 QuestCfgId = 1; // 任务id
}

// 完成任务
message FinishQuestReq {
  repeated int32 QuestCfgIds = 1; // 任务id
}

// 完成任务的返回结果
message FinishQuestRes {
  repeated int32 QuestCfgIds = 1; // 任务id
  repeated FinishedQuestData FinishedQuestDatas = 2; // 完成任务的数据
}
