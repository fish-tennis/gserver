#服务器进程唯一id
ServerId: 11
#监听客户端
Client:
  Addr: :10002
#监听网关
Gate:
  Addr: :10003
#数据库
Mongo:
  Uri: mongodb://127.0.0.1:27017
  Db: testdb
  #连接最大空闲时间(秒),闲置连接定期回收防止长期占用实例连接数
  MaxConnIdleTimeSec: 300
#缓存
Redis:
  Uri:
    - 127.0.0.1:6379
  UserName:
  Password:
  Cluster: false
  DB: 0
#接收告警信息的webhook地址
#AlertWebhook: 

#是否测试环境(测试环境开启;生产环境必须为false或不配置,防止正式服作弊)
IsTestEnv: true