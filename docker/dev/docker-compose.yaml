version: '3.8'
#快速构建一个测试环境,包含1个gate,1个login,2个game,2个social

services:
  gate:
    build:
      context: ../../
      dockerfile: Dockerfile
    image: gserver:latest
    volumes:
      - ./config/gate_1.yaml:/app/config/gate_1.yaml #dev环境的服务配置文件
    network_mode: host
    restart: unless-stopped
    depends_on:
      - redis
      - mongodb
    command: ["-conf=./config/gate_1.yaml"]

  login:
    build:
      context: ../../
      dockerfile: Dockerfile
    image: gserver:latest
    volumes:
      - ./config/login_11.yaml:/app/config/login_11.yaml
    network_mode: host
    restart: unless-stopped
    depends_on:
      - redis
      - mongodb
    command: ["-conf=./config/login_11.yaml"]
  
  game1:
    build:
      context: ../../
      dockerfile: Dockerfile
    image: gserver:latest
    volumes:
      - ./config/game_101.yaml:/app/config/game_101.yaml
    network_mode: host
    restart: unless-stopped
    depends_on:
      - redis
      - mongodb
    command: ["-conf=./config/game_101.yaml"]

  game2:
    build:
      context: ../../
      dockerfile: Dockerfile
    image: gserver:latest
    volumes:
      - ./config/game_102.yaml:/app/config/game_102.yaml
    network_mode: host
    restart: unless-stopped
    depends_on:
      - redis
      - mongodb
    command: ["-conf=./config/game_102.yaml"]

  social1:
    build:
      context: ../../
      dockerfile: Dockerfile
    image: gserver:latest
    volumes:
      - ./config/social_201.yaml:/app/config/social_201.yaml
    network_mode: host
    restart: unless-stopped
    depends_on:
      - redis
      - mongodb
    command: ["-conf=./config/social_201.yaml"]

  social2:
    build:
      context: ../../
      dockerfile: Dockerfile
    image: gserver:latest
    volumes:
      - ./config/social_202.yaml:/app/config/social_202.yaml
    network_mode: host
    restart: unless-stopped
    depends_on:
      - redis
      - mongodb
    command: ["-conf=./config/social_202.yaml"]

  # --- Redis 服务 ---
  redis:
    image: redis:7-alpine
    network_mode: host
    restart: unless-stopped
    volumes:
      - redis-data:/data/redis # 持久化数据
    command: redis-server --appendonly yes --dir /data/redis # 持久化数据写入挂载卷
    # environment:  # 如果需要密码，可以添加
    #   - REDIS_PASSWORD=yourpassword

  # --- MongoDB 服务 ---
  mongodb:
    image: mongo:7
    network_mode: host
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    # 如需账号密码,可启用:
    #   environment:
    #     MONGO_INITDB_ROOT_USERNAME: root
    #     MONGO_INITDB_ROOT_PASSWORD: 123456

# 定义持久化卷
volumes:
  redis-data:
  mongo-data:
